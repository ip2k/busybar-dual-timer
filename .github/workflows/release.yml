name: Release

# Two ways in, one path through:
#   - Actions > Release > Run workflow, pick a bump. Everything happens here:
#     version, tag, push, build, GitHub release, npm publish. Nothing local.
#   - Or push a v* tag yourself, and the rest still runs.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      bump:
        description: 'patch, minor, major, or an exact version like 1.2.3'
        required: true
        default: patch

permissions:
  contents: write
  id-token: write # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing (OIDC) needs a recent npm; Node 22 ships an older one.
      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@latest

      - run: npm ci

      # Check before versioning. A tag should never be created for a red tree.
      - run: npm run typecheck
      - run: npm test

      # Everything from the event reaches the script through `env:`, never as a
      # `${{ }}` expression inside `run:`. An expression is pasted into the
      # script before bash sees it, and git accepts tag names containing
      # backticks, `$(` and `|` — so a pushed tag could otherwise execute
      # whatever it was named. Both inputs are also held to the only shapes
      # they are allowed to have.
      - name: Version and tag
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          BUMP: ${{ github.event.inputs.bump }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            case "$BUMP" in
              patch|minor|major) ;;
              *) [[ "$BUMP" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::bump must be patch, minor, major or X.Y.Z"; exit 1; } ;;
            esac
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            npm version "$BUMP" -m "v%s"
            git push --follow-tags
            TAG="v$(node -p "require('./package.json').version")"
          else
            [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag must look like v1.2.3"; exit 1; }
            TAG="$REF_NAME"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG"

      - run: npm run build
      - name: Confirm the build produced something runnable
        run: node -e "require('node:fs').accessSync('dist/index.js')"

      - name: Assemble the bundle
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          OUT="busybar-dual-timer-${TAG}"
          mkdir -p "$OUT"
          cp -r dist "$OUT"/
          cp package.json config.example.json README.md LICENSE busybar-dual-timer.service "$OUT"/
          cp -r docs "$OUT"/

          # Somewhere to drop a custom sound. Without this the directory is
          # missing and the app silently falls back to the synthesised chime.
          mkdir -p "$OUT/assets"
          printf 'Drop a sound file here and point expiry.sound.file at it.\nSee docs/custom-sounds.md.\n' > "$OUT/assets/README.txt"

          cp QUICKSTART.txt "$OUT"/
          tar -czf "${OUT}.tar.gz" "$OUT"
          sha256sum "${OUT}.tar.gz" > "${OUT}.tar.gz.sha256"
          echo "ASSET=${OUT}.tar.gz" >> "$GITHUB_ENV"

      # Prove the artefact runs before handing it to anyone. It cannot reach a
      # Bar from CI, but it must start, read its config and fail on the network
      # rather than on a missing file or a broken module graph.
      - name: Smoke-test the bundle
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/verify && tar xzf "$ASSET" -C /tmp/verify
          cd "/tmp/verify/busybar-dual-timer-${TAG}"
          node dist/index.js --help > /dev/null
          node dist/index.js --version
          cp config.example.json config.json
          set +e
          OUTPUT=$(timeout 25s node dist/index.js 2>&1)
          set -e
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -qiE "cannot find module|err_module|syntaxerror|config:"; then
            echo "::error::the bundled build is not runnable"; exit 1
          fi
          echo "bundle starts, --help and --version work, and it fails only on the network"

      # Published via npm trusted publishing (OIDC): the registry trusts this
      # repository and workflow directly, so there is no token to store, rotate
      # or leak, and no 2FA prompt for CI to fail on. Provenance comes with it.
      #
      # Gated on the repository rather than on a secret, so a fork runs
      # everything else and simply does not publish.
      - name: Publish to npm
        if: ${{ github.repository == 'ip2k/busybar-dual-timer' }}
        run: npm publish --provenance

      - name: Note if npm was skipped
        if: ${{ github.repository != 'ip2k/busybar-dual-timer' }}
        run: echo "::warning::not the canonical repository, so npm publish was skipped. The GitHub release was still created."

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" "$ASSET" "${ASSET}.sha256" \
            --title "$TAG" \
            --generate-notes \
            --notes-file - <<NOTES
          ## Install

          \`\`\`bash
          npx busybar-dual-timer          # try it, nothing installed
          npm i -g busybar-dual-timer     # or keep it
          \`\`\`

          Over USB that works with no configuration at all. Otherwise
          \`busybar-dual-timer --init\` writes a starter \`config.json\` beside you.

          Prefer no npm? Download \`$ASSET\`, unpack, and run \`node dist/index.js\`.
          Node 22+ is the only requirement either way. Verify with \`${ASSET}.sha256\`.
          NOTES

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>busy-dual-timer controls</title>

  <!-- Colours chosen to read on both light and dark GitHub themes -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <!-- START callout, above -->
  <text x="392" y="34" font-size="14" fill="#3ba7ff" text-anchor="middle" font-weight="700">press → start / pause</text>
  <text x="392" y="52" font-size="11" fill="#6e7681" text-anchor="middle">instant, nothing to wait for</text>
  <line x1="392" y1="64" x2="392" y2="112" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- the device -->
  <rect x="110" y="126" width="420" height="88" rx="12" fill="#1c2128" stroke="#444c56" stroke-width="1.5"/>

  <!-- front panel -->
  <rect x="132" y="146" width="216" height="48" rx="3" fill="#05070a" stroke="#30363d" stroke-width="1"/>
  <text x="142" y="162" font-size="9" fill="#3ba7ff" font-weight="600">A</text>
  <text x="240" y="181" font-size="26" fill="#3ba7ff" text-anchor="middle" font-weight="700" letter-spacing="1">24:59</text>
  <rect x="132" y="190" width="150" height="3" fill="#3ba7ff"/>

  <!-- START button -->
  <circle cx="392" cy="170" r="21" fill="#21262d" stroke="#484f58" stroke-width="1.5"/>
  <circle cx="392" cy="170" r="8" fill="#0080ff" opacity="0.9"/>
  <text x="392" y="207" font-size="9" fill="#8b949e" text-anchor="middle" font-weight="600">START</text>

  <!-- dial -->
  <circle cx="468" cy="170" r="25" fill="#21262d" stroke="#484f58" stroke-width="1.5"/>
  <circle cx="468" cy="170" r="15" fill="#2d333b" stroke="#30363d" stroke-width="1"/>
  <line x1="468" y1="155" x2="468" y2="162" stroke="#8b949e" stroke-width="2" stroke-linecap="round"/>
  <text x="468" y="207" font-size="9" fill="#8b949e" text-anchor="middle" font-weight="600">DIAL</text>

  <!-- panel caption -->
  <text x="240" y="232" font-size="10" fill="#6e7681" text-anchor="middle">72 × 16 front panel</text>

  <!-- dial callouts, all to the right so nothing collides -->
  <line x1="495" y1="156" x2="556" y2="124" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="564" y="118" font-size="13" fill="#33d17a" font-weight="700">turn</text>
  <text x="564" y="134" font-size="11" fill="#adbac7">± 1 minute</text>

  <line x1="495" y1="166" x2="556" y2="160" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="564" y="164" font-size="13" fill="#33d17a" font-weight="700">hold + turn</text>
  <text x="564" y="180" font-size="11" fill="#adbac7">± 5 seconds</text>

  <line x1="495" y1="180" x2="556" y2="212" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="564" y="212" font-size="13" fill="#33d17a" font-weight="700">click</text>
  <text x="564" y="228" font-size="11" fill="#adbac7">switch A ↔ B</text>

  <line x1="480" y1="194" x2="556" y2="262" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="564" y="262" font-size="13" fill="#33d17a" font-weight="700">double-click</text>
  <text x="564" y="278" font-size="11" fill="#adbac7">reset</text>

  <!-- notes, bottom left, clear of the callouts -->
  <text x="110" y="272" font-size="12" fill="#adbac7" font-weight="600">Switching keeps both timers' remaining time</text>
  <text x="110" y="289" font-size="11" fill="#6e7681">and always stops the clock — press START to resume</text>

  <text x="110" y="315" font-size="12" fill="#adbac7" font-weight="600">BACK is unbound</text>
  <text x="110" y="332" font-size="11" fill="#6e7681">the firmware uses it to navigate its own UI</text>

  <text x="110" y="352" font-size="11" fill="#6e7681">Put the lever on CUSTOM — on APPS the firmware can take the screen</text>
</svg>
